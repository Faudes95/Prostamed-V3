  <text x="45" y="50" text-anchor="middle" fill="#64748b" font-family="Arial,sans-serif" font-size="10">Izquierdo</text>
  <text x="155" y="50" text-anchor="middle" fill="#64748b" font-family="Arial,sans-serif" font-size="10">Derecho</text>
  <text x="100" y="192" text-anchor="middle" fill="#e53535" font-family="Arial,sans-serif" font-size="11" font-weight="bold">Ambos lóbulos afectados</text>
