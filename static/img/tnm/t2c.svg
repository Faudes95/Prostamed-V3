<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="t2c_ll" cx="38%" cy="40%" r="52%">
      <stop offset="0%" stop-color="#4cc8f0"/><stop offset="45%" stop-color="#1a8fd4"/>
      <stop offset="80%" stop-color="#0d5fa0"/><stop offset="100%" stop-color="#062d55"/>
    </radialGradient>
    <radialGradient id="t2c_lr" cx="62%" cy="40%" r="52%">
