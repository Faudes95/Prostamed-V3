  <!-- Lóbulo derecho -->
  <path d="M 108 70 C 122 62, 152 58, 168 72 C 184 86, 186 116, 178 136 C 170 156, 150 166, 134 164 C 120 162, 110 154, 106 142 C 102 130, 104 106, 106 90 Z"
