  <ellipse cx="58" cy="112" rx="20" ry="26" fill="url(#t2c_tl)" opacity="0.82"/>
  <ellipse cx="53" cy="104" rx="7" ry="5" fill="white" opacity="0.1"/>
  <!-- TUMOR lóbulo derecho -->
  <ellipse cx="142" cy="112" rx="20" ry="26" fill="url(#t2c_tr)" opacity="0.82"/>
