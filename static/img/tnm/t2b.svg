<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="t2b_ll" cx="38%" cy="40%" r="52%">
      <stop offset="0%" stop-color="#4cc8f0"/><stop offset="45%" stop-color="#1a8fd4"/>
      <stop offset="80%" stop-color="#0d5fa0"/><stop offset="100%" stop-color="#062d55"/>
    </radialGradient>
    <radialGradient id="t2b_lr" cx="62%" cy="40%" r="52%">
      <stop offset="0%" stop-color="#4cc8f0"/><stop offset="45%" stop-color="#1a8fd4"/>
      <stop offset="80%" stop-color="#0d5fa0"/><stop offset="100%" stop-color="#062d55"/>
    </radialGradient>
    <radialGradient id="t2b_tumor" cx="42%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#ff6b6b"/><stop offset="50%" stop-color="#e53535"/>
      <stop offset="100%" stop-color="#b01c1c"/>
    </radialGradient>
    <filter id="t2b_sh"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.3"/></filter>
  </defs>
  <line x1="30" y1="170" x2="170" y2="170" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>
  <!-- Lóbulo izquierdo -->
  <path d="M 92 70 C 78 62, 48 58, 32 72 C 16 86, 14 116, 22 136 C 30 156, 50 166, 66 164 C 80 162, 90 154, 94 142 C 98 130, 96 106, 94 90 Z"
        fill="url(#t2b_ll)" filter="url(#t2b_sh)"/>
  <!-- Lóbulo derecho -->
  <path d="M 108 70 C 122 62, 152 58, 168 72 C 184 86, 186 116, 178 136 C 170 156, 150 166, 134 164 C 120 162, 110 154, 106 142 C 102 130, 104 106, 106 90 Z"
        fill="url(#t2b_lr)" filter="url(#t2b_sh)"/>
  <!-- Surco central -->
  <path d="M 100 65 C 99 90, 98 120, 100 168" stroke="#041e45" stroke-width="2" fill="none" opacity="0.4"/>
  <!-- TUMOR: >50% del lóbulo izquierdo (más grande) -->
  <path d="M 58 78 C 40 85, 30 100, 30 118 C 30 138, 42 152, 58 155 C 72 152, 82 140, 84 122 C 86 104, 78 85, 70 78 Z"
        fill="url(#t2b_tumor)" opacity="0.85"/>
  <ellipse cx="50" cy="100" rx="8" ry="6" fill="white" opacity="0.12"/>
  <!-- Venas lóbulo derecho -->
  <path d="M 145 80 C 150 100, 152 120, 148 145" stroke="#38b8e8" stroke-width="0.8" fill="none" opacity="0.35"/>
  <!-- Brillos -->
  <ellipse cx="145" cy="90" rx="12" ry="8" fill="white" opacity="0.10" transform="rotate(10,145,90)"/>
  <!-- Etiquetas -->
  <text x="55" y="50" text-anchor="middle" fill="#64748b" font-family="Arial,sans-serif" font-size="10">Lóbulo</text>
  <text x="55" y="60" text-anchor="middle" fill="#64748b" font-family="Arial,sans-serif" font-size="10">Izquierdo</text>
  <text x="145" y="50" text-anchor="middle" fill="#64748b" font-family="Arial,sans-serif" font-size="10">Lóbulo</text>
  <text x="145" y="60" text-anchor="middle" fill="#64748b" font-family="Arial,sans-serif" font-size="10">Derecho</text>
  <text x="100" y="192" text-anchor="middle" fill="#e53535" font-family="Arial,sans-serif" font-size="11" font-weight="bold">&gt; 50% de un lóbulo</text>
</svg>
