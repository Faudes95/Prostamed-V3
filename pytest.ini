[pytest]
# ProstaNet pytest configuration.
#
# Markers
# -------
# slow      → suites cuyo wall-clock excede 5 minutos (E2E playwright,
#             matrix de regresión completa, smoke runners). Se ejecutan
#             SOLO cuando se pasa explícitamente `-m slow` o `-m "slow or not slow"`.
#
# Por defecto, `pytest tests/` ejecuta todo lo NO-slow (ciclo rápido,
# objetivo <5 min). Para correr la suite completa: `pytest tests/ -m "slow or not slow"`.
markers =
    slow: tests E2E o de matriz que exceden 5 min de wall-clock; excluidos del ciclo rápido por defecto

# Excluir slow del ciclo por defecto
addopts = -m "not slow"
