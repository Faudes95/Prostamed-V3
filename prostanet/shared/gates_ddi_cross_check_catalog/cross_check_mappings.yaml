# ──────────────────────────────────────────────────────────────────────
# Gates × DDI Cross-Check Catalog — Faubot 2026-04-25 (XXXV)
# ──────────────────────────────────────────────────────────────────────
# Tier 4 K — Refactor declarativo: migra los 3 dicts Python de
# `gates_ddi_cross_check.py` (~250 líneas imperativo) a YAML declarativo.
#
# Para cada gate code, declara:
#   - ddi_categories: tuple[str] de DDIEngine.category names que ENRIQUECEN
#     la contraindicación (DDIs concomitantes que agravan el gate)
#   - oncology_drugs: list[str] de fármacos oncológicos (lowercase ES)
#     que el gate restringe (input para DDIEngine.check_interactions)
#   - ui_summary: str legible para clínico/auditor (formato "Gate N (...)")
#   - faubot_added_in: versión Faubot que añadió el mapping (auditoría)
#
# Aporte a auditabilidad post-Tier 4 K:
#   - **VERSIÓN:** cada cross-check versionable per-mapping (SHA via loader);
#     auditor regulatorio puede revisar cambios mapping-by-mapping
#   - **CÓMO:** declarativo facilita grep/inspección vs código Python
#   - **DATOS:** schema validation automática por loader
#
# Patrón consistente con `pivotal_gates_catalog/` que está 100% YAML-native
# (28/28 gates). Cierra deuda arquitectónica: 21 mappings DDI ahora en YAML.
#
# Backward-compat: `gates_ddi_cross_check.py` API pública (cross_check_gates_with_ddi,
# cross_messages_for_not_recommended, get_gate_ddi_mapping_summary) inalterada.
# Internamente reads from YAML at import time.
# ──────────────────────────────────────────────────────────────────────

