# Faubot 2026-04-26 (LXXIX) — Auditoría #67E — Sm-153 EDTMP eligibility.
#
# Razón clínica:
#   **Samarium-153-EDTMP (Quadramet®)** es radiofármaco beta-emisor
#   FDA-approved (1997) para palliación bone pain en mCRPC widespread:
#
#   1. **Mecanismo**: localiza en hidroxiapatita ósea + emite beta
#      penetración 0.5-3 mm
#   2. **Indicación**: bone pain refractario + multifocal bone mets
#   3. **Dosis**: 1.0 mCi/kg IV single dose (puede repetirse cada 3m)
#   4. **Eficacia**: 60-80% mejoran dolor en 1-4 semanas
#      Duración respuesta: 1-4 meses
#   5. **Pre-requisitos**:
#      - ANC ≥1500/µL
#      - Plaquetas ≥100,000/µL (idealmente ≥150K)
#      - Hemoglobin ≥9 g/dL
#      - Creatinine clearance >30 mL/min
#      - Bone scan multi-foci positive
#      - Esperanza vida ≥3 meses
#
#   Severity: informational — gate alerta opción terapéutica radiofármaco
#   beta-emisor para palliación bone pain.
#
#   Coexistencia: gate 76 puede coexistir con gates 13/14 (Ra-223), gate 73
#   (BPI pain), gate 9 (BMA prophylaxis).
# ──────────────────────────────────────────────────────────────────────

