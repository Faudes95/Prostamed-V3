# ──────────────────────────────────────────────────────────────────────
# Gate 24: docetaxel_neuropathy_longitudinal_grade2_post_4_cycles
# ──────────────────────────────────────────────────────────────────────
# Faubot 2026-04-25 (XXVII) — Gate YAML-NATIVE (Auditoría #39).
#
# Razón clínica:
#   La neurotoxicidad de los taxanos (docetaxel, cabazitaxel) es
#   **acumulativa y dosis-dependiente**. CTCAE v5 grado ≥3 ya está
#   cubierto por Gate 2 (severe_neuropathy_grade3) como hard-block
#   instantáneo. Sin embargo, pacientes con G2 (síntomas moderados que
#   limitan instrumental ADLs) tras ≥4 ciclos de docetaxel deberían
#   considerar suspensión o switch porque:
#
#     - TAX-327 (Tannock NEJM 2004;351:1502): 25-30% G2+ neuropathy
#       tras 6 ciclos; reversibilidad incompleta en 30-50%.
#     - TROPIC (de Bono Lancet 2010;376:1147): cabazitaxel 17% G2+
#       neuropatía; cross-tolerance parcial con docetaxel.
#     - CHAARTED (Sweeney NEJM 2015;373:737): 30% G2 neuropatía
#       acumulativa post-6 ciclos; toxicidad limitante de dose.
#     - CARD (de Wit NEJM 2019;381:2506): neuropathy acumulativa
#       contraindica re-rechallenge taxane.
#
#   Threshold canónico (NCCN PROS-G v5.2026 + ASCO Cumulative Tox 2024):
#     - Gate 24 dispara cuando G2 documentado AND ≥4 ciclos recibidos
#     - O bien: flag explícito `cumulative_neuropathy_documented=Sí`
#     - Override: `neuropathy_recovered_post_docetaxel=Sí` tras dose-hold
#       + recuperación a G≤1 documentada en bioquímica/clínica
#
#   Coexistencia con Gate 2 (NO se elimina):
#     - Gate 2: G≥3 instant block (cualquier momento, sin condición timing)
#     - Gate 24: G≥2 longitudinal post-4-cycles (más permisivo en grado,
#       pero requiere exposición acumulativa documentada)
#
#   Bloquea: TODOS los taxanos (docetaxel re-tratamiento + cabazitaxel
#   introducción) por cross-tolerance neurotóxica documentada.
# ──────────────────────────────────────────────────────────────────────

code: docetaxel_neuropathy_longitudinal_grade2_post_4_cycles
title: "Docetaxel × neuropatía longitudinal G≥2 post-4-ciclos (CTCAE v5 + TAX-327)"
faubot_added_in: "2026-04-25 XXVII"
faubot_yaml_native: true
severity: hard_block

trigger:
  type: any_of
  triggers:
    # Camino 1: flag explícito documentado por oncología
    - type: truthy_flag
      field: cumulative_neuropathy_documented
      alias_fields:
        - cumulative_taxane_neuropathy
        - taxane_neuropathy_grade2_post_treatment
    # Camino 2: G≥2 AND ≥4 ciclos (toxicidad acumulativa documentada)
    - type: all_of
      triggers:
        - type: numeric_threshold
          field: peripheral_neuropathy_grade
          threshold: 2
        - type: numeric_threshold
          field: docetaxel_cycles_received
          alias_fields:
            - taxane_cycles_received
            - docetaxel_cycle_count
            - docetaxel_total_cycles
          threshold: 4

# Override: tras dose-hold + recuperación neurológica documentada
override:
  type: truthy_flag
  field: neuropathy_recovered_post_docetaxel

regimen_codes:
  - REGIMEN_CODES_TAXANE

keywords:
  - KEYWORDS_TAXANE

message: |
  Docetaxel/cabazitaxel NO deben re-iniciarse o continuarse con neuropatía
  periférica G≥2 (CTCAE v5: síntomas moderados limitando ADLs instrumentales)
  tras ≥4 ciclos de docetaxel previo. La neurotoxicidad de los taxanos es
  acumulativa y dosis-dependiente; G2 post-4-ciclos predice progresión a G3
  con re-exposición y reversibilidad incompleta en 30-50% de pacientes.

  Evidencia regulatoria:
    - TAX-327 (Tannock NEJM 2004;351:1502) — 25-30% G2+ neuropatía
      tras 6 ciclos docetaxel; reversibilidad incompleta 30-50%.
    - TROPIC (de Bono Lancet 2010;376:1147) — cabazitaxel 17% G2+
      neuropatía; cross-tolerance parcial con docetaxel.
    - CHAARTED (Sweeney NEJM 2015;373:737) — 30% G2 acumulativa
      tras 6 ciclos; toxicidad limitante de dose en mHSPC.
    - CARD (de Wit NEJM 2019;381:2506) — neuropatía acumulativa
      contraindica re-rechallenge taxane en mCRPC.

  Conducta clínica:
  1. Suspender docetaxel inmediatamente si G≥2 sintomática.
  2. Documentar grado CTCAE v5 + ciclos recibidos + tiempo desde
     última dosis.
  3. Manejo sintomático:
     - Pregabalina 150-300mg/día o gabapentina 600-1800mg/día
     - Duloxetina 30-60mg/día (preferida en evidencia ASCO 2020)
     - Vitamina B12 + folato si déficit documentado
     - Fisioterapia + ejercicio supervisado
  4. Reevaluación neurológica cada 4-6 semanas hasta G≤1.
  5. Override (`neuropathy_recovered_post_docetaxel=Sí`) tras
     recuperación a G≤1 documentada por neurología/oncología.
  6. Considerar terapia alternativa NO-taxane:
     - ARPI (enzalutamida, abiraterona, darolutamida) si LVEF/cardio OK
     - Lu-177-PSMA-617 si elegible (sin perfil neurotóxico)
     - Radium-223 si solo enfermedad ósea sintomática
     - Cabazitaxel CONTRAINDICADO por cross-tolerance neurotoxic

  Notar: Gate 24 coexiste con Gate 2 (severe_neuropathy_grade3) que
  bloquea G≥3 en cualquier momento. Gate 24 añade timing longitudinal
  para G≥2 post-exposición acumulativa documentada.

evidence_tag: tax327_tropic_chaarted_card_ctcae_v5
trial_refs:
  - TAX-327
  - TROPIC
  - CHAARTED
  - CARD
  - "CTCAE v5"

references:
  - "Tannock IF et al. TAX-327. NEJM 2004;351:1502-1512."
  - "de Bono JS et al. TROPIC. Lancet 2010;376:1147-1154."
  - "Sweeney CJ et al. CHAARTED. NEJM 2015;373:737-746."
  - "de Wit R et al. CARD. NEJM 2019;381:2506-2518."
  - "Loprinzi CL et al. ASCO chemotherapy-induced peripheral neuropathy guideline 2020."
  - "Smith EML et al. — Duloxetine for CIPN. JAMA 2013;309:1359."
  - "CTCAE v5.0 — Peripheral motor/sensory neuropathy grading."

nccn_eau_alignment:
  nccn_section: "PROS-G v5.2026 — Taxane discontinuation criteria"
  eau_section: "EAU 2026 §6.5.2 — Cumulative taxane toxicity"
  asco_section: "ASCO 2020 Chemotherapy-Induced Peripheral Neuropathy Guideline"
