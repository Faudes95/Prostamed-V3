# ──────────────────────────────────────────────────────────────────────
# Gate 78: actinium_225_psma_investigational
# ──────────────────────────────────────────────────────────────────────
# Faubot 2026-04-26 (LXXIX) — Auditoría #67E — Ac-225 PSMA roadmap.
#
# Razón clínica:
#   **Actinium-225-PSMA** es radiofármaco alpha-emisor PSMA-targeted en
#   investigación intensiva para mCRPC PSMA-positive heavily pre-treated:
#
#   1. **Mecanismo**: alpha-emisor (T½ 9.9 días) → 4 alpha decays cascade
#      → daño DNA double-strand breaks (LET alta 80-100 keV/µm)
#   2. **Ventajas vs Lu-177-PSMA** (beta):
#      - Penetración 50-100 µm (vs 600-2000 µm Lu-177)
#      - Mayor citotoxicidad por decay (LET alpha vs beta)
#      - Útil en disease bulky resistente
#      - Mejor para micrometástasis
#   3. **Desventajas**:
#      - Disponibilidad limitada (Ac-225 producción rare)
#      - Costo muy alto
#      - Toxicidad xerostomía severa (>Lu-177)
#      - Sin FDA-approval aún (investigational)
#
#   Evidencia (Kratochwil JNM 2016 + Sathekge JNM 2024):
#   - Response rate 60-80% en heavily pre-treated post-Lu-177
#   - PSA50 response 60-70%
#   - Survival benefit pendiente trials randomizados
#
#   Severity: informational — gate alerta opción investigational en
#   pacientes heavily pre-treated PSMA-positive sin opciones standard.
#
#   Coexistencia: gate 78 sigue gate 71 (PSMA progression) + post-Lu-177.
# ──────────────────────────────────────────────────────────────────────

