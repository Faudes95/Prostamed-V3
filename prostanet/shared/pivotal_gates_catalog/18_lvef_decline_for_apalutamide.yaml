# ──────────────────────────────────────────────────────────────────────
# Gate 18: lvef_decline_for_apalutamide
# ──────────────────────────────────────────────────────────────────────
# Faubot 2026-04-25 (XIII) — Migrado a YAML declarativo.
#
# Razón clínica:
#   Caída LVEF significativa (<50% absoluto o caída >10 puntos desde
#   basal) → contraindica apalutamida (Erleada label + TITAN/SPARTAN).
#   Override: lvef_recovered_for_arpi=Sí tras optimización IC con
#   IECA + BB + diurético + LVEF ≥50% documentado en eco/MUGA.
# ──────────────────────────────────────────────────────────────────────

code: lvef_decline_for_apalutamide
title: "LVEF decline (<50% o caída >10 pts) → contraindica apalutamida"
faubot_added_in: "2026-04-25 VII"
faubot_migrated_to_yaml_in: "2026-04-25 XIII"
severity: hard_block

# any_of: dispara si flag explícito O LVEF absoluto < 50% O caída > 10 pts
trigger:
  type: any_of
  triggers:
    - type: truthy_flag
      field: lvef_decline_for_arpi
    - type: numeric_below
      field: lvef_percent
      alias_fields:
        - lvef_baseline_percent
      threshold: 50
    - type: numeric_baseline_delta_above
      baseline_field: lvef_baseline_percent
      current_field: lvef_percent
      threshold: 10

# Override por recuperación documentada
override:
  type: truthy_flag
  field: lvef_recovered_for_arpi

regimen_codes:
  - REGIMEN_CODES_APALUTAMIDE

keywords:
  - KEYWORDS_APALUTAMIDE

message: |
  Apalutamida (Erleada) NO debe iniciarse con caída LVEF significativa
  (LVEF <50% absoluto o caída >10 puntos desde basal). Erleada FDA
  prescribing information advierte sobre cardiac dysfunction; TITAN
  (Chi NEJM 2019;381:13) reportó cardiac AE 4.6% vs placebo 2.4%; SPARTAN
  (Smith NEJM 2018;378:1408) eventos cardiovasculares mayores 6.6%.
  ASCO/ESC Cardio-Oncology Guidelines 2022 + Plana JACC 2014 establecen
  LVEF <50% como cardiac dysfunction y caída >10 puntos como deterioro
  significativo. Optimizar IC ANTES de iniciar apalutamida: (1) IECA/ARA2
  a dosis óptima, (2) betabloqueador (carvedilol/bisoprolol), (3) diurético
  si congestión, (4) cardio-oncología consult. Reevaluar
  (`lvef_recovered_for_arpi=Sí`) tras LVEF ≥50% documentado en eco/MUGA
  seguimiento. Considerar enzalutamida (sin warning LVEF específico) o
  darolutamida (perfil cardiac favorable).

evidence_tag: erleada_label_titan_spartan_asco_esc_2022
trial_refs:
  - TITAN
  - SPARTAN
  - "Erleada label"
  - "ASCO/ESC Cardio-Oncology 2022"

references:
  - "Chi KN et al. TITAN. NEJM 2019;381:13-24."
  - "Smith MR et al. SPARTAN. NEJM 2018;378:1408-1418."
  - "Plana JC et al. ASE/EACVI Cardiotoxicity. JACC 2014;63:2751-2768."
  - "Erleada (apalutamide) FDA prescribing information — Cardiac dysfunction warning."
nccn_eau_alignment:
  nccn_section: "PROS-G v5.2026 — Hard-block LVEF para apalutamida"
