message: |
  Radioterapia pelvica previa bloquea re-irradiacion curativa no
  protocolizada por riesgo acumulado de toxicidad GI/GU, fistula y
  necrosis tisular. El override solo aplica con protocolo formal de
  salvage re-RT o intencion paliativa documentada.

