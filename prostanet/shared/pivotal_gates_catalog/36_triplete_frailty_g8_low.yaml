  nccn_section: "PROS-G v5.2026 — Geriatric assessment + triplete eligibility"
  eau_section: "EAU 2026 §6.5.7 — Elderly considerations for ARSI + chemo combinations"
  siog_section: "SIOG 2024 — G8 screening + CGA in metastatic prostate cancer"
  asco_section: "ASCO Geriatric Oncology Guideline 2018 — CGA in older adults with cancer"
