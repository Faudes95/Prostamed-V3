  - ARASENS
  - "Nubeqa label"

references:
  - "Fizazi K, et al. ARAMIS. NEJM 2019;380:1235-1246."
  - "Smith MR, et al. ARASENS. NEJM 2022;386:1132-1142."
  - "Bayer Nubeqa (darolutamide) prescribing information 2024."
nccn_eau_alignment:
