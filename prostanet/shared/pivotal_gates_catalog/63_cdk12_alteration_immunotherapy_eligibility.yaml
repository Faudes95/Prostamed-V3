  - "PROfound Cohort B (de Bono NEJM 2020;382:2091)"
  - "NCCN Prostate v5.2026 PROS-2 (category 2B)"
  - "EAU 2026 §6.5.7"
  - "KEYNOTE-365/199 mCRPC pembrolizumab subgroup"
  - "CheckMate 650 nivolumab + ipilimumab mCRPC"
