  - "Saad F et al. — Bone health in mCRPC. Lancet Oncol 2019."

nccn_eau_alignment:
  nccn_section: "PROS-G v5.2026 — Ra-223 + bone health monitoring (mandatory)"
  eau_section: "EAU 2026 §6.5.4 — Radium-223 fracture risk assessment"
  who_section: "WHO FRAX 2008 + NOF 2022 treatment thresholds"
