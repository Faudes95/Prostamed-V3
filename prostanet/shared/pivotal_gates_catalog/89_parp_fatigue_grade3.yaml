# ──────────────────────────────────────────────────────────────────────
# Gate 89: parp_fatigue_grade3
# ──────────────────────────────────────────────────────────────────────
# Faubot 2026-04-30 (LXCVI.A) — Tier 1 Adverse Event Coverage Closure.
#
# Razón clínica:
#   PARP inhibitors (olaparib, niraparib, talazoparib, rucaparib) tienen
#   incidencia significativa de fatiga severa que afecta calidad vida +
#   adherencia terapéutica:
#
#   - **PROfound (de Bono NEJM 2020;382:2091)**: olaparib fatigue any
#     grade 41%, G3+ 5%
#   - **PROpel (Saad Lancet Oncol 2023;24:1094)**: olaparib + abi fatigue
#     any grade 38%, G3+ 4%
#   - **MAGNITUDE (Chi JCO 2023;41:3339)**: niraparib + abi fatigue 38%,
#     G3 6%
#   - **TALAPRO-2 (Agarwal Lancet 2023;402:291)**: talazoparib + enz
#     fatigue any 47%, G3+ 8% (mayor con anemia coexistente)
#   - **TRITON-3 (Fizazi NEJM 2023;388:719)**: rucaparib fatigue any 29%,
#     G3+ 7%
#
#   Mecanismo: anemia secundaria (mielosuppression directa) + alteración
#   metabolismo energético + cytokine-mediated central fatigue.
#
#   Implicación clínica G3 (severe, ADL limiting):
#   - Workup secondary causes: anemia (CBC + reticulocyte + iron + B12 +
#     folate), thyroid (TSH), depression (PHQ-9), sleep apnea
#   - Dose reduction PRN (e.g., olaparib 300mg→250mg BID)
#   - Erythropoietic stimulating agents si Hb <10 g/dL
#   - Transfusion si Hb <8 g/dL or symptomatic
#   - Light exercise + pacing strategies (proven benefit)
#   - Avoid CYP2C19 + CYP3A inducers (drug interactions amplifican)
#
#   Soft_warning porque NO siempre requiere discontinuation, pero sí
#   evaluación + intervención sistemática.
# ──────────────────────────────────────────────────────────────────────

code: parp_fatigue_grade3
