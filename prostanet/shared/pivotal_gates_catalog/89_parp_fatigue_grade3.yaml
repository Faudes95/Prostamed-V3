message: |
  ⚠️ SOFT WARNING: Fatiga G3 bajo PARP inhibitor → workup secondary
  causes + dose modification.

  🎯 EVIDENCIA INCIDENCIA POR TRIAL:

  | Trial | PARP | Fatigue any % | G3+ % |
  |-------|------|---------------|-------|
  | PROfound | Olaparib | 41% | 5% |
  | PROpel | Olaparib + abi | 38% | 4% |
  | MAGNITUDE | Niraparib + abi | 38% | 6% |
  | TALAPRO-2 | Talazoparib + enz | 47% | 8% |
  | TRITON-3 | Rucaparib | 29% | 7% |

  🎯 WORKUP SECONDARY CAUSES (TODOS los pacientes G3):

  1. **Hematology**:
     - CBC con diferencial + reticulocyte count
     - Hb <10 g/dL → erythropoietic stimulating agent
     - Hb <8 g/dL or symptomatic → transfusion
     - Ferritina + iron studies + B12 + folate

  2. **Endocrine**:
     - TSH + free T4 (ARPI partner si triplete)
     - Cortisol AM + ACTH si signs Addison

  3. **Mental health**:
     - PHQ-9 (depression major frequently overlooked)
     - GAD-7 (anxiety)
     - Sleep history + Epworth Sleepiness Scale

  4. **Drug interactions**:
     - Review todos CYP2C19 + CYP3A inhibitors/inducers
     - Olaparib: avoid clarithromycin, ketoconazole, rifampin
     - Niraparib: monitor with CYP1A2 substrates

  5. **Otros**:
     - Renal function (CrCl < 50 amplifica fatigue)
     - Hepatic (ALT/AST elevations)
     - Cardiac (pro-BNP si suspect cardiac dysfunction)

  🎯 DOSE MODIFICATION (si secondary causes ruled out):

  | PARP | Dose initial | Dose level -1 | Dose level -2 |
  |------|--------------|----------------|------------------|
  | Olaparib | 300mg BID | 250mg BID | 200mg BID |
  | Niraparib | 200-300mg/d | 200mg/d | 100mg/d |
  | Talazoparib | 0.5mg/d | 0.35mg/d | 0.25mg/d |
  | Rucaparib | 600mg BID | 500mg BID | 400mg BID |

  🎯 INTERVENCIONES NO-FARMACOLÓGICAS:
  - Light exercise 20-30 min/día (proven benefit en CFS oncológica)
  - Pacing strategies + activity diary
  - Cognitive behavioral therapy si chronic fatigue >3m
  - Mindfulness/yoga (level B evidence)

  💡 INFRAESTRUCTURA REQUERIDA:
  - `fatigue_ctcae_grade`: int 0-4 (CTCAE v5.0)

