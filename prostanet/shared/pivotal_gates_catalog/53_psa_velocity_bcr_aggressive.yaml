nccn_eau_alignment:
  nccn_section: "PROS-G v5.2026 — BCR post-RP: salvage RT + ADT for high-risk PSADT <3m"
  eau_section: "EAU 2026 §6.4.1 — Biochemical recurrence after RP management"
  rtog_section: "RTOG-9601 + GETUG-AFU-16 — salvage RT + ADT pivotal trials"
  asco_section: "ASCO Salvage RT Guidelines 2024"
