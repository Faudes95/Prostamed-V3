message: |
  ⚠️ SOFT WARNING: Xerostomia G2+ bajo Lu-177-PSMA → salivary management
  + dental protection mandatory.

  🎯 EVIDENCIA INCIDENCIA:

  | Trial | Régimen | Xerostomia any % | G3+ % |
  |-------|---------|-------------------|-------|
  | VISION | Lu-177 vs placebo | 38.8% vs 0.5% | 1.0% |
  | TheraP | Lu-177 vs cabazitaxel | 60% vs 4% | <2% |
  | PSMAfore | Lu-177 pre-chemo | ~40% | 1% |

  🎯 CLASIFICACIÓN CTCAE v5:

  | Grado | Síntomas | Acción |
  |-------|----------|--------|
  | G1 | Symptomatic, sin altered eating | Salivary stimulants + dental hygiene |
  | **G2** | **Moderate symptoms, altered intake** | **Pilocarpine + saliva substitutes + dental consult** |
  | G3 | Inability to adequately aliment orally | Pilocarpine + IV hydration + tube feeding considered |
  | G4 | Life-threatening dehydration | Hospitalization + total parenteral nutrition |

  🎯 MANEJO ESCALONADO G2:

  1. **Salivary stimulants**:
     - Lemon drops (sugar-free) cada 2-3h
     - Sugar-free gum (xylitol)
     - Hydration agresiva (8 vasos agua/d)

  2. **Farmacológico**:
     - **Pilocarpine 5 mg PO TID** (cholinergic glandular stimulation)
     - Cevimelina 30 mg PO TID alternative
     - Avoid anticholinergics si posible

  3. **Saliva substitutes**:
     - Biotene Oral Balance gel
     - Oasis Moisturizing Mouth Spray
     - Mouthwashes alcohol-free

  4. **Dental protection**:
     - Dental consult inicial + cada 3 meses
     - Fluoride toothpaste high-concentration
     - Fluoride trays nighttime (custom)
     - Avoid sugary foods/drinks (caries risk ↑↑)

  5. **Dose modification next cycle**:
     - Considerar dose reduction 25% Lu-177 si G3
     - Skip cycle si G4

  🎯 LONG-TERM CONSIDERATIONS:
  - Xerostomia puede persistir post-tratamiento (chronic)
  - Caries multi-superficie progresiva sin protection
  - Candidiasis oral risk ↑ → fluconazole prophylaxis si recurrent
  - QoL impact significant → consider integration palliative care

  💡 INFRAESTRUCTURA REQUERIDA:
  - `xerostomia_ctcae_grade`: int 0-4 (CTCAE v5.0)

