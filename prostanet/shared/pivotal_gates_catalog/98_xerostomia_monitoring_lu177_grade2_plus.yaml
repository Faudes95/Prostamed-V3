# ──────────────────────────────────────────────────────────────────────
# Gate 98: xerostomia_monitoring_lu177_grade2_plus
# ──────────────────────────────────────────────────────────────────────
# Faubot 2026-04-30 (LXCVI.C) — Tier 3 Interaction/Synergistic Gates.
#
# Razón clínica:
#   Lu-177-PSMA-617 tiene tropismo a glándulas salivares (PSMA expression
#   en parotid + submandibular) → xerostomia (boca seca) es AE frecuente:
#
#   - **VISION (Sartor NEJM 2021;385:1091)**: Lu-177-PSMA en mCRPC
#     - Xerostomia any grade 38.8% vs placebo 0.5%
#     - Xerostomia G3+ 1.0%
#     - Mostly G1-G2 chronic
#
#   - **TheraP (Hofman Lancet 2021;397:797)**: Lu-177 vs cabazitaxel
#     - Xerostomia any 60% Lu-177 vs 4% cabazitaxel
#     - Significant impact en QoL
#
#   - **PSMAfore (Sartor ESMO 2023)**: Lu-177 pre-chemo
#     - Similar xerostomia incidence
#
#   Mecanismo: Lu-177 emite β-particles (~2 mm range). Glándulas salivares
#   tienen PSMA expression → uptake significativo → radiation damage
#   crónica + xerostomia.
#
#   Implicación clínica G2+ (oral intake limitada/altered):
#   - Salivary stimulants (lemon drops, sugar-free gum)
#   - Pilocarpine 5 mg PO TID (cholinergic agonist, glandular stimulation)
#   - Saliva substitutes (Biotene, Oasis)
#   - Dental hygiene aggressive (fluoride toothpaste, dental visits cada 3m)
#   - Avoid mouth-drying medications (anticholinergics, diuretics si posible)
#   - Considerar dose reduction Lu-177 next cycle si severe
#
#   Soft_warning porque NO siempre requires discontinuation, pero impacta
#   significativamente QoL + dental health → intervención mandatory.
# ──────────────────────────────────────────────────────────────────────

