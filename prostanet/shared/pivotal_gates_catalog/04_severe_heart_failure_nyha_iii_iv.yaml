# ──────────────────────────────────────────────────────────────────────
# Gate 4: severe_heart_failure_nyha_iii_iv
# ──────────────────────────────────────────────────────────────────────
# Faubot 2026-04-25 (XIII) — Migrado a YAML declarativo.
#
# Razón clínica:
#   Insuficiencia cardíaca NYHA III-IV → contraindicación abiraterona
#   por retención hidrosalina (mineralocorticoide). LATITUDE / PEACE-1 /
#   COU-AA-301/302 excluyeron NYHA III-IV.
# ──────────────────────────────────────────────────────────────────────

code: severe_heart_failure_nyha_iii_iv
title: "Insuficiencia cardíaca NYHA III-IV"
faubot_added_in: "2026-04-23 I"
faubot_migrated_to_yaml_in: "2026-04-25 XIII"
severity: hard_block

# any_of: dispara si flag explícito O nyha_class está en lista
trigger:
  type: any_of
  triggers:
    - type: truthy_flag
      field: severe_heart_failure_nyha_iii_iv
    - type: string_match
      field: nyha_class
      match_values: [III, IV, "3", "4"]
      case_insensitive: true
      strip: true

override: null

regimen_codes:
  - REGIMEN_CODES_ABIRATERONE

keywords:
  - KEYWORDS_ABIRATERONE

message: |
  Abiraterona NO recomendada con insuficiencia cardíaca NYHA III-IV
  (retención hidrosalina y sobrecarga de volumen). Considerar enzalutamida
  o darolutamida y optimizar manejo cardíaco (LATITUDE / PEACE-1 / COU-AA-301
  / COU-AA-302 excluyeron NYHA III-IV).

evidence_tag: latitude_couaa301_couaa302
trial_refs:
  - LATITUDE
  - PEACE-1
  - COU-AA-301
  - COU-AA-302

references:
  - "Fizazi K et al. LATITUDE. Lancet Oncol 2019;20:686-700."
  - "Ryan CJ et al. COU-AA-302. NEJM 2013;368:138-148."
nccn_eau_alignment:
  nccn_section: "PROS-G v5.2026 — Hard-block cardio para abiraterona"
