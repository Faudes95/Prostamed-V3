  - "de Bono JS et al. COU-AA-301. NEJM 2011;364:1995-2005."
  - "Ryan CJ et al. COU-AA-302. NEJM 2013;368:138-148."
  - "Fizazi K et al. LATITUDE. NEJM 2017;377:352-360."
  - "James ND et al. STAMPEDE arm G. NEJM 2017;377:338-351."
  - "Fizazi K et al. — Abiraterone hepatotoxicity safety analysis."
