  - "PCWG3 (Scher JCO 2016;34:1402)"
  - "PERCIST 1.0 (Wahl JNM 2009;50:122S)"
  - "RECIST 1.1 (Eisenhauer EJC 2009;45:228)"
  - "PROMISE (Hofman Lancet 2020;395:1208)"
  - "VISION (Sartor NEJM 2021;385:1091)"
  - "NCCN Prostate v5.2026 PROS-O"
