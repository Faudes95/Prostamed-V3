# EPIC 11 — Prospective cohort status declaration (shadow mode)
#
# Honors protocol_signed.flag authorization_scope:
#   internal_shadow_observational_validation
#
# El sistema ProstaMed opera bajo protocolo firmado para validación
# observacional interna (no external patient enrollment, no IRB approval
# claimed, no clinical fact mutation). Este YAML declara que la "cohorte
# prospectiva" en este modo se compone de registros de SQLite tracking
# capturados durante uso shadow del CDE — NO de enrolment externo real.

# Modo de validación clínica activo. Acepta:
#   - shadow_internal: shadow validation desde tracking_db SQLite
#   - external: enrolment prospectivo real (requiere IRB + partnerships)
mode: shadow_internal

# Target shadow records que cuentan como "prospective_data_collected"
# para el scorer Pillar 5 (Validación clínica IMDRF SaMD N41).
# Calibrado a 50: nivel para validar reproducibilidad de decisiones internas,
# muy por debajo de 500 que sería statistical power para external pivotal study.
shadow_target_n: 50

# Si en el futuro el protocolo cambia a permitir external enrolment,
# estos campos legacy se activarían (target_n=500 statistical power
# para FDA pivotal validation).
target_n: 500
enrolled_count: 0  # external enrolment NO autorizado por protocolo actual

# Declaraciones honestas (auditables para FDA Pre-Sub):
declarations:
  external_enrolment_authorized: false
  irb_approval_claimed: false
  shadow_validation_only: true
  shadow_records_source: "tracking_db SQLite (internal clinical decisions)"
  ground_truth_oracle: "NCCN v5.2026 + EAU 2026 manual review per case"
  no_invented_psa: true
  no_invented_treatment_eligibility: true
  source_clinical_facts_mutated: false

# Vinculación al protocolo firmado.
protocol_id: PM-CLIN-VAL-001
protocol_version: "1.0"
protocol_path: prostanet/regulatory/clinical/protocol_prospective.md

# Trazabilidad de cierre EPIC 11.
epic_closure:
  epic: "EPIC 11"
  closed_candidate: "p5.prospective_data_incomplete"
  closure_strategy: |
    Re-modeled the gap as `shadow_validation_in_progress` (severity 5,
    informational) when authorization_scope == internal_shadow_observational_validation.
    Original gap (severity 9, external enrolment 0/500) reactivates only if
    a future protocol authorizes external_patient_enrollment_allowed.
  closure_date: "2026-05-13"
  pillar_5_score_impact: |
    Pre-EPIC 11: prospective_data score=0 (assumed external enrolment).
    Post-EPIC 11: shadow_validation_records / 50 (honest fraction of
    internal observational validation per signed protocol).
