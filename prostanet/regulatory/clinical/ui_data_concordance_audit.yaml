document: UI-Data Concordance Audit — Patient Profile (EPIC 22a)
schema_version: '1.0'
generated_at: '2026-05-13'
epic: EPIC 22a — UI-Data Concordance Audit baseline
audited_templates:
  - templates/patient_profile.html
  - templates/patient_profile_v2.html
audit_methodology:
  - faubot_phase_6_data_integrity: applied
  - ultrathink_detective: 3 parallel Explore agents
  - audit_scope: every CTA → endpoint → DB write → derivative → UI re-render → clinical logic consumer

declarations:
  no_destructive_changes: true
  scope: append + repair only (no deletion of existing clinical logic or frontend)
  status_legend:
    functional: end-to-end works (UI → DB → derivative → clinical logic)
    partial: UI exists, partial backend, gaps in clinical logic integration
    broken: UI references data path but it doesn't work end-to-end
    placeholder: pretty UI with no real data wiring

# ─────────────────── A. Patient profile CTAs (broad inventory) ───────────────────

ctas_inventory:

  - cta_text: '+ captura longitudinal'
    template_location: 'patient_profile_v2.html:150'
    target_endpoint: '/longitudinal-capture/<nss>'
    endpoint_exists: true
    backend_route: 'app.py:4758 (GET /longitudinal-capture/<nss>)'
    data_persistence: 'PSA, testosterone, labs, ECOG via /api/longitudinal/<nss>/append'
    derivative_consumer: 'build_patient_record_derivatives reads biomarker_longitudinal'
    clinical_logic_consumer: 'reconciled_state.py + various copilots'
    status: functional
    notes: 'Working pipeline for PSA + biomarkers. Histopathology MISSING — see EPIC 22b'

  - cta_text: 'Capturar primer PSA →'
    template_location: 'patient_profile_v2.html:2417'
    target_endpoint: '/longitudinal-capture/<nss>'
    endpoint_exists: true
    backend_route: 'app.py:4758'
    status: functional

  - cta_text: 'Capturar línea →'
    template_location: 'patient_profile_v2.html:2475'
    target_endpoint: '/longitudinal-capture/<nss>'
    endpoint_exists: true
    status: functional

  - cta_text: 'Capturar faltantes'
    template_location: 'patient_profile_v2.html:193'
    target_endpoint: 'dynamic ({{ lane.cta_url }})'
    endpoint_exists: 'depends on lane'
    status: partial
    notes: 'Routes to lane-specific capture surfaces; some lanes (germline_carrier) lack capture form'

  - cta_text: 'Use el botón para agregar'
    template_location: 'patient_profile.html:5910'
    target_endpoint: 'N/A (text references button)'
    endpoint_exists: false
    status: broken
    issue: 'Template promises a button but no button HTML rendered in conditional block'
    fix_path: 'EPIC 22d.1 — UI audit: add button or remove dead reference'

  - cta_text: 'Completar reporte histopatológico'
    template_location: 'patient_profile_v2.html (proposed in EPIC 22b)'
    target_endpoint: '/longitudinal-capture/<nss>?moment=biopsy_capture (planned)'
    endpoint_exists: false
    status: broken
    issue_root_cause: |
      4 architectural disconnects:
      1. /api/longitudinal/<nss>/append (app.py:5020) NO supports kind=biopsy
      2. /api/biopsy/<patient_id> (app.py:4134) ORPHANED — no UI calls it
      3. gleason_at_rp defined in moment_capture_schemas.py:105 but NOT in clinical_fact_registry.py FACT_SPECS
      4. margin_status similarly capturable but not canonicalized
    fix_path: 'EPIC 22b — primary focus'
    clinical_impact: HIGH
    user_complaint_origin: 'Documented in EPIC 22 user request 2026-05-13'

  - cta_text: 'Cortana realtime toggle'
    template_location: 'patient_profile_v2.html:769 (EPIC 22a.4 NEW)'
    target_endpoint: '/api/voice/epic21/health + localStorage'
    endpoint_exists: true
    status: functional
    notes: 'Auto-detects PersonaPlex availability; disabled when sidecar unavailable'

# ─────────────────── B. profile_view keys (UI consumption vs derivatives production) ───────────────────

profile_view_key_audit:

  consumed_by_ui_v2:
    - identity.nss
    - identity.age
    - psa_history (multiple positions)
    - treatment_lines
    - reconciled_state (latest_assessment)
    - care_overlays
    - clinical_signals
    - next_best_action
    - patient_twin (EPIC 19)
    - risk_stratified_localized (EPIC 20c)
    - mcrpc_subtype (EPIC 20c)
    - hereditary_germline (EPIC 20c)
    - post_rt_bcr (EPIC 20c)
    - oligoprogression (EPIC 20c)

  consumed_but_NOT_populated:
    - patient_twin.preferences.capture_completeness_pct
      issue: 'UI renders the value but build_patient_twin_view falls back to defaults; no capture surface for preferences exists'
      severity: medium
      fix_path: EPIC 22d.2

  populated_but_NOT_consumed:
    - histopathology_summary
      source: 'profile_compass.py:6752 (active_copilot_bundle.get)'
      issue: 'Field produced but no template section renders it'
      severity: low

  MISSING_from_derivatives:
    - biopsy_date
    - gleason_at_rp
    - gleason_primary_pattern
    - gleason_secondary_pattern
    - isup_grade
    - cores_positive
    - cores_total
    - margin_status
    - perineural_invasion
    - chromogranin_a_value (NEPC marker)
    - synaptophysin_biopsy_positive (NEPC)
    - small_cell_morphology (NEPC)
    - nse_value (NEPC)
    fix_path: 'EPIC 22b.4 — extend build_patient_record_derivatives'

