# ─────────────────── D. Clinical logic integration gaps (5 broken) ───────────────────

clinical_logic_integration_gaps:

  - gap_id: BROKEN_INTEGRATION_1
    title: 'RP Gleason never canonicalized'
    location_capture: 'moment_capture_schemas.py:105 (gleason_at_rp FieldSpec defined)'
    location_persist: 'tracking_db._save_structured_biopsy_session writes to biopsy_details'
    location_canonicalize: '❌ NOT in clinical_fact_registry.py FACT_SPECS'
    location_consumer: 'clinical_state_classifier reads diagnostic gleason, NOT RP gleason'
    clinical_impact: 'Post-RP risk stratification uses pre-operative Gleason instead of final pathology'
    severity: HIGH
    fix_path: EPIC 22b.5

  - gap_id: BROKEN_INTEGRATION_2
    title: 'Surgical margin status missing from fact registry'
    location_capture: 'moment_capture_schemas.py:101-104 (margin_status defined)'
    location_persist: 'tracking_db writes to biopsy_details.margin_status'
    location_canonicalize: '❌ NO FactSpec for margin_status or surgical_margin_status'
    location_consumer: 'post_rp_salvage_copilot reads source.get("surgical_margin") from raw payload'
    clinical_impact: 'Margin status not longitudinal-stable; salvage decision may use stale data'
    severity: HIGH
    fix_path: EPIC 22b.5

  - gap_id: BROKEN_INTEGRATION_3
    title: 'Percent positive cores not blocking validation'
    location_capture: 'biopsy_sessions.max_involvement_pct'
    location_validation: 'decision_input_requirements_engine.py:307 — optional flag, NOT blocking'
    clinical_impact: 'very_low_risk classification can proceed with missing pct → incorrect AS recommendation'
    severity: MEDIUM
    fix_path: EPIC 22b.6

  - gap_id: BROKEN_INTEGRATION_4
    title: 'Patient Twin OS no recompute triggers'
    location_read: 'patient_twin_os.py extract_preferences() called on-demand at UI render'
    location_missing: '❌ No event listener on patient_clinical_facts.insert for hrr_status, goal_of_care'
    clinical_impact: 'New HRR+ result does not invalidate cached ranking; UI shows stale recommendation'
    severity: HIGH
    fix_path: EPIC 22b.7

  - gap_id: BROKEN_INTEGRATION_5
    title: 'Clinical Readiness Tower → no fill endpoint'
    location_tracker: 'clinical_readiness_tower.py LANE_REQUIRED_FIELDS:92-188'
    location_ui: 'Shows "requires_data" with "Complete" button'
    location_capture: '❌ capture_flows.py FOLLOWUP_PREFERRED_FIELDS missing post-RP/margin fields'
    clinical_impact: 'UI flags missing data but clicking button does not route to capture form'
    severity: MEDIUM
    fix_path: EPIC 22b.8

# ─────────────────── E. Capture endpoints inventory ───────────────────

capture_endpoints:

  - route: '/api/longitudinal/<nss>/append'
    method: POST
    accepts: 'PSA, testosterone, HB, ALP, LDH + extended (ECOG, BPI, ESAS, PHQ9, CTCAE, PSMA-PET, etc.)'
    location: 'app.py:4945-5100'
    nss_based: true
    status: functional
    epic_22b_extension: 'add kind="biopsy" with STRUCTURED_BIOPSY mapping'

  - route: '/api/biopsy/<patient_id>'
    method: POST
    status: ORPHANED
    issue: |
      Endpoint exists at app.py:4134 but NEVER called from UI.
      Type mismatch: route expects patient_id (int), UI uses NSS (string).
    fix_path: 'EPIC 22d.3 — deprecate with 308 redirect to /api/longitudinal append'

  - route: '/api/patients/<id>/documents'
    method: POST
    accepts: 'document upload (PDF/image) with OCR extraction'
    extractor: 'prostanet/domains/patient_tracking/document_ingestion.py'
    extracts: 'gleason_primary, gleason_secondary, isup_grade, positive_cores, total_cores, perineural_invasion'
    status: partial
    issue: 'NSS→patient_id lookup required; not consistent with longitudinal append NSS-based'

  - route: '/longitudinal-capture/<nss>'
    method: GET
    purpose: 'Render capture form (route param: ?moment=<schema>)'
    location: 'app.py:4758'
    status: functional

