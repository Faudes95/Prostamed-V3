# FMEA — ProstaMed/ProstaNet 2026
# Per ISO 14971:2019 + AAMI TIR57:2016
# 15 canonical prostate-cancer hazards (LXXXVIII bootstrap; expandable by loop)

document: "FMEA Tabular Risk Analysis"
faubot_release: "2026-04-27 LXXXVIII"
last_updated: "2026-04-27"
methodology: "ISO 14971:2019 (severity × occurrence × detectability)"
threshold_action_rpn: 100
pilar_5_coupling: "Each hazard maps to clinical evidence in CLINICAL_EVIDENCE_2026.md"

hazards:
  - hazard: psa_stale_decision
    description: "Decision Hoy renderizada con PSA >60 días sin recompute hook → recomendación stale"
    severity: 7
    occurrence: 5
    detectability: 4
    rpn: 140
    mitigation_id: MIT-001
    mitigation_description: "_recompute_after_append() helper LXXXVI Fase 1A + data_freshness_severity en compass + alert si freshness=stale"
    mitigation_status: implemented
    control_verification: "tests/test_audit_lxxxvi_cde_auditable_real.py::test_g2861_longitudinal_psa_append_recompute_works"
    residual_rpn: 35
    code_paths: ["app.py:_recompute_after_append", "prostanet/presentation/v2_adapters.py:_compass_full"]

  - hazard: gate_misclassification
    description: "Gate fires con severity incorrecta (e.g., HARD_BLOCK clasificado como SOFT_WARNING)"
    severity: 9
    occurrence: 3
    detectability: 5
    rpn: 135
    mitigation_id: MIT-002
    mitigation_description: "YAML schema validation + per-gate SHA + tests dedicados por gate (3942+ tests + audit_*.py)"
    mitigation_status: implemented
    control_verification: "tests/test_pivotal_*.py + tests/test_audit*.py"
    residual_rpn: 30

  - hazard: arpi_dose_miscalc
