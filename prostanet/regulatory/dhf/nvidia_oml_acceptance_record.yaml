# ─────────────────── Revocation policy ───────────────────

revocation:
  conditions_triggering_revocation:
    - NVIDIA changes OML terms incompatible with shadow validation scope
    - HuggingFace removes nvidia/personaplex-base from public access
    - Safety routing invariant test fails (HIGH/CRITICAL incorrectly routed to PersonaPlex)
    - Clinical safety incident traced to PersonaPlex output

  revocation_procedure:
    - Stop sidecar containers (docker stop personaplex-sidecar)
    - Unset PERSONAPLEX_SIDECAR_URL env var (forces Cortana orchestrator to Whisper-only)
    - Document incident in audit_tracking.md
    - Update this YAML acceptance.accepted=false with revocation_date + reason
    - All 105+ EPIC 21 tests still pass without PersonaPlex (Whisper-only mode)

